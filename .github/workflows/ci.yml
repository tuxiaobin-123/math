name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - run: make test
      - run: npm run test:site
      - run: python -m compileall -q src scripts tests
      - run: node --check docs/data.js && node --check docs/app.js
